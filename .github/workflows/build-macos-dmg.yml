name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    paths:
      - "Prophet6Control_v0_2_1_source_macos_installer.zip"
      - ".ci/overlay/**"
      - ".github/workflows/build-macos-dmg.yml"

permissions:
  contents: read

concurrency:
  group: prophet6control-v0-2-3-macos15
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and verify AU, VST3, standalone and DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select and report Apple build toolchain
        run: |
          xcode-select -p
          clang --version
          cmake --version
          hdiutil help >/dev/null

      - name: Extract source package
        run: |
          mkdir -p "$RUNNER_TEMP/p6-source"
          unzip -q Prophet6Control_v0_2_1_source_macos_installer.zip -d "$RUNNER_TEMP/p6-source"
          test -f "$RUNNER_TEMP/p6-source/Prophet6Control/CMakeLists.txt"
          echo "PROJECT_ROOT=$RUNNER_TEMP/p6-source/Prophet6Control" >> "$GITHUB_ENV"

      - name: Apply versioned CI source overlay
        run: |
          cp .ci/overlay/CMakeLists.txt "$PROJECT_ROOT/CMakeLists.txt"
          cp .ci/overlay/Source/ProtocolCore.cpp "$PROJECT_ROOT/Source/ProtocolCore.cpp"
          cp .ci/overlay/Tests/CMakeLists.txt "$PROJECT_ROOT/Tests/CMakeLists.txt"
          cp .ci/overlay/Tests/protocol_stress_tests.cpp "$PROJECT_ROOT/Tests/protocol_stress_tests.cpp"
          cp .ci/overlay/scripts/package_dmg_macos.sh "$PROJECT_ROOT/scripts/package_dmg_macos.sh"
          cp .ci/overlay/scripts/build_macos.sh "$PROJECT_ROOT/scripts/build_macos.sh"
          chmod +x "$PROJECT_ROOT/scripts/package_dmg_macos.sh" "$PROJECT_ROOT/scripts/build_macos.sh"

      - name: Build protocol tests with sanitizers
        run: |
          cmake -S "$PROJECT_ROOT/Tests" -B "$RUNNER_TEMP/p6-protocol-tests"             -DCMAKE_BUILD_TYPE=RelWithDebInfo             -DP6_ENABLE_SANITIZERS=ON
          cmake --build "$RUNNER_TEMP/p6-protocol-tests" --parallel 2
          ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1           UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1             ctest --test-dir "$RUNNER_TEMP/p6-protocol-tests" --output-on-failure

      - name: Build AU, VST3 and standalone and create local-use DMG
        env:
          JUCE_TAG: "9.0.5"
          CMAKE_OSX_ARCHITECTURES: "arm64"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          VERSION: "0.2.3"
        run: |
          cd "$PROJECT_ROOT"
          chmod +x scripts/bootstrap_and_build_macos.sh scripts/build_macos.sh scripts/package_dmg_macos.sh
          # JUCE 9 Base64 decoding writes to an OutputStream, not a MemoryBlock.
          python3 - <<'PY'
          from pathlib import Path
          source = Path("Source/PluginProcessor.cpp")
          text = source.read_text()
          old = """        juce::MemoryBlock decoded;
                  if (encoded.isEmpty() || !juce::Base64::convertFromBase64(decoded, encoded))
                      return false;
                  const auto* begin = static_cast<const std::uint8_t*>(decoded.getData());
                  result.assign(begin, begin + decoded.getSize());"""
          new = """        juce::MemoryOutputStream decoded;
                  if (encoded.isEmpty() || !juce::Base64::convertFromBase64(decoded, encoded))
                      return false;
                  const auto decodedBlock = decoded.getMemoryBlock();
                  const auto* begin = static_cast<const std::uint8_t*>(decodedBlock.getData());
                  result.assign(begin, begin + decodedBlock.getSize());"""
          if old not in text:
              raise SystemExit("Expected JUCE Base64 decode block was not found")
          source.write_text(text.replace(old, new, 1))
          PY
          ./scripts/bootstrap_and_build_macos.sh

      - name: Upload build candidate for installation testing
        uses: actions/upload-artifact@v4
        with:
          name: Prophet6Control-macOS-DMG-v0.2.3-candidate
          path: ${{ env.PROJECT_ROOT }}/dist/Prophet-6-Control-v0.2.3.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Verify all three bundles and their arm64 executables
        run: |
          ARTIFACTS="$PROJECT_ROOT/build/Prophet6Control_artefacts/Release"
          check_bundle() {
            bundle="$1"
            executable="$2"
            test -d "$bundle"
            test -f "$bundle/Contents/Info.plist"
            test -f "$executable"
            plutil -lint "$bundle/Contents/Info.plist"
            lipo "$executable" -verify_arch arm64
            codesign --verify --deep --strict --verbose=2 "$bundle"
            file "$executable"
          }
          check_bundle "$ARTIFACTS/AU/Prophet 6 Control.component" "$ARTIFACTS/AU/Prophet 6 Control.component/Contents/MacOS/Prophet 6 Control"
          check_bundle "$ARTIFACTS/VST3/Prophet 6 Control.vst3" "$ARTIFACTS/VST3/Prophet 6 Control.vst3/Contents/MacOS/Prophet 6 Control"
          check_bundle "$ARTIFACTS/Standalone/Prophet 6 Control.app" "$ARTIFACTS/Standalone/Prophet 6 Control.app/Contents/MacOS/Prophet 6 Control"

      - name: Validate Audio Unit with Apple's auval
        run: |
          AU_SOURCE="$PROJECT_ROOT/build/Prophet6Control_artefacts/Release/AU/Prophet 6 Control.component"
          AU_DEST="$HOME/Library/Audio/Plug-Ins/Components/Prophet 6 Control.component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$AU_DEST"
          ditto "$AU_SOURCE" "$AU_DEST"
          xattr -dr com.apple.quarantine "$AU_DEST" 2>/dev/null || true
          codesign --verify --deep --strict --verbose=2 "$AU_DEST"
          auval -v aumi P6Ct StTl

      - name: Verify DMG and installer contents
        run: |
          DMG="$PROJECT_ROOT/dist/Prophet-6-Control-v0.2.3.dmg"
          test -s "$DMG"
          hdiutil verify "$DMG"
          MOUNT_POINT="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG"
          test -d "$MOUNT_POINT/Audio Units/Prophet 6 Control.component"
          test -d "$MOUNT_POINT/VST3/Prophet 6 Control.vst3"
          test -d "$MOUNT_POINT/Applications/Prophet 6 Control.app"
          test -x "$MOUNT_POINT/Install.command"
          bash -n "$MOUNT_POINT/Install.command"
          codesign --verify --deep --strict "$MOUNT_POINT/Audio Units/Prophet 6 Control.component"
          codesign --verify --deep --strict "$MOUNT_POINT/VST3/Prophet 6 Control.vst3"
          codesign --verify --deep --strict "$MOUNT_POINT/Applications/Prophet 6 Control.app"
          find "$MOUNT_POINT" -maxdepth 3 -print
          hdiutil detach "$MOUNT_POINT"
          rmdir "$MOUNT_POINT"
          ls -lh "$DMG"

      - name: Upload locally installable DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prophet6Control-macOS-DMG-v0.2.3-local-install
          path: ${{ env.PROJECT_ROOT }}/dist/Prophet-6-Control-v0.2.3.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
